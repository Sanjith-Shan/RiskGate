name: CI

# Nothing here needs the Kaggle data. data/ and models/ are gitignored, every
# Go test runs on generated or committed fixtures (testdata/, rules/), and the
# tests that can use real data (TestLeakage, the service benchmarks) read it
# only when an environment variable points at it.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt, tidy, vet, staticcheck, signature vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy is a no-op
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: webhook vectors agree with an independent openssl implementation
        run: scripts/check_signature_vectors.sh

  # The race detector and coverage run as separate jobs. Together they took
  # about 7 minutes, because TestLeakage's parallel replays all hit the same
  # atomic coverage counters. Under -race the heaviest tests shrink their
  # samples (raceEnabled), so the coverage job is also the one full-strength
  # run of those tests.
  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: go test -race
        run: go test -race ./...

  cover:
    name: go test with coverage (no race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: go test -cover
        run: go test -covermode=set -coverprofile=coverage.out ./...
      - name: coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # The stream pipeline's tests run against franz-go's in-process fake
  # cluster in every job above. This job runs them again against a real
  # Apache Kafka broker, so consumer-group rebalances, offset commits and
  # crash recovery are exercised against the broker's own implementation.
  kafka:
    name: stream tests against a real Kafka broker
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: wait for the broker
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/localhost/9092) 2>/dev/null && exit 0; sleep 2; done; exit 1
      - name: go test ./internal/stream against Kafka
        env:
          RISKGATE_KAFKA_BROKERS: localhost:9092
        run: go test -count=1 -v ./internal/stream/

  fuzz:
    name: fuzz (20s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: fuzz every Fuzz target
        run: scripts/fuzz_all.sh 20s
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          if [ -d python/tests ] || [ -n "$(find python -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | head -n 1)" ]; then
            python -m pip install --upgrade pip
            if [ -f python/requirements.txt ]; then python -m pip install -r python/requirements.txt; fi
            python -m pip install pytest
            python -m pytest python/
          else
            echo "no Python tests yet; skipping"
          fi
